<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
      .wipe { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
      .wipe-panel {
        position: absolute;
        top: -10%;
        left: 50%;
        width: 2400px;
        height: 120%;
        margin-left: -1200px;
      }
      .wipe-pink { background: linear-gradient(100deg, #ff5c7a 0%, #ff7ea2 100%); }
      .wipe-navy { background: #0f172b; }
      .wipe-trail { position: absolute; top: -10%; left: 50%; width: 90px; height: 120%; margin-left: -45px; }
  </style>

  <div id="root" data-composition-id="transitions" data-width="1920" data-height="1080">
    <!-- WIPES:BEGIN -->
      <div id="wipe-a" class="wipe clip" data-start="4.0" data-duration="0.7" data-track-index="0">
        <div id="wipe-a-panel" data-layout-allow-overflow class="wipe-panel wipe-pink"></div>
        <div id="wipe-a-trail" data-layout-allow-overflow class="wipe-trail wipe-navy"></div>
      </div>
      <div id="wipe-b" class="wipe clip" data-start="7.65" data-duration="0.7" data-track-index="0">
        <div id="wipe-b-panel" data-layout-allow-overflow class="wipe-panel wipe-pink"></div>
        <div id="wipe-b-trail" data-layout-allow-overflow class="wipe-trail wipe-navy"></div>
      </div>
      <div id="wipe-c" class="wipe clip" data-start="16.95" data-duration="0.7" data-track-index="0">
        <div id="wipe-c-panel" data-layout-allow-overflow class="wipe-panel wipe-navy"></div>
        <div id="wipe-c-trail" data-layout-allow-overflow class="wipe-trail wipe-pink"></div>
      </div>
      <div id="wipe-d" class="wipe clip" data-start="19.55" data-duration="0.7" data-track-index="0">
        <div id="wipe-d-panel" data-layout-allow-overflow class="wipe-panel wipe-pink"></div>
        <div id="wipe-d-trail" data-layout-allow-overflow class="wipe-trail wipe-navy"></div>
      </div>
      <div id="wipe-e" class="wipe clip" data-start="22.7" data-duration="0.7" data-track-index="0">
        <div id="wipe-e-panel" data-layout-allow-overflow class="wipe-panel wipe-navy"></div>
        <div id="wipe-e-trail" data-layout-allow-overflow class="wipe-trail wipe-pink"></div>
      </div>
      <!-- WIPES:END -->
  </div>

  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });

      // Skewed panel slides in, covers the frame at the cut (zero velocity), then shoots out.
      function wipe(id, cut, dir) {
        const panel = "#" + id + "-panel";
        const trail = "#" + id + "-trail";
        const d = dir > 0 ? 1 : -1;
        tl.fromTo(panel, { x: -3000 * d, skewX: -14 }, { x: 0, skewX: -14, duration: 0.28, ease: "power3.out" }, cut - 0.28);
        tl.to(panel, { x: 3000 * d, duration: 0.3, ease: "power3.in" }, cut + 0.02);
        tl.fromTo(trail, { x: -3200 * d, skewX: -14 }, { x: -1500 * d, skewX: -14, duration: 0.3, ease: "power3.out" }, cut - 0.28);
        tl.to(trail, { x: 3200 * d, duration: 0.34, ease: "power3.in" }, cut + 0.04);
      }
      // WIPES:BEGIN
      wipe("wipe-a", 4.3, 1);
      wipe("wipe-b", 7.95, -1);
      wipe("wipe-c", 17.25, 1);
      wipe("wipe-d", 19.85, -1);
      wipe("wipe-e", 23.0, 1);
      // WIPES:END
      window.__timelines["transitions"] = tl;
    })();
  </script>
</template>
